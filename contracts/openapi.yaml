      properties:
        funding:
          $ref: "#/components/schemas/FundingOverview"
        available:
          $ref: "#/components/schemas/USDString"
        held:
          $ref: "#/components/schemas/USDString"
        total:
          $ref: "#/components/schemas/USDString"
        availableCredits:
          type: integer
          format: int64
          description: Credits you can spend now (the same amount as `available`, rounded down to a whole credit).
        heldCredits:
          type: integer
          format: int64
          minimum: 0
          description: Credits held by accepted tasks that have not settled yet.
        totalCredits:
          type: integer
          format: int64
          description: "`availableCredits` + `heldCredits`."
    BalanceEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/Balance"
    APIModel:
      type: object
      required:
        - model
        - family
        - displayName
        - provider
        - modality
        - tasks
        - async
        - taskTimeoutSeconds
        - enabled
        - available
        - quantityField
        - version
        - availability
        - badges
        - relatedModels
        - updatedAt
        - credits
      properties:
        model:
          type: string
          description: Model call name in `<publisher>/<model>/<task>` form; the value `createTask.model` takes. Image editing uses the `edit` suffix.
          example: alibaba/wan-3.0/image-to-video
        family:
          type: string
          description: Stable product-family identifier; endpoint variants are listed in `tasks` and expressed by `inputSchema`.
        displayName:
          type: string
        provider:
          type: string
          description: Model creator/author identifier, such as the research lab that built the model.
        modality:
          type: string
          enum:
            - image
            - video
            - audio
        tasks:
          type: array
          items:
            type: string
          description: "The internal task classification of this one endpoint. Always exactly one element, and it is not always the suffix of `model`: image editing endpoints are published as `.../edit` but classified as `image-to-image` (or `image-edit` for single-purpose tools). Use `model` to call, and `tasks[0]` only to group or filter. New values appear as models are added, so treat the set as open."
        async:
          type: boolean
        toolkit:
          type: string
          enum:
            - subject-swap
            - studio-tools
          description: Which toolkit family this model belongs to (subject-swap for identity swaps; studio-tools for single-purpose image and video tools such as background removal or upscaling). Informational classification for catalogue grouping only; it does not participate in routing, pricing or authorization. Absent when the model is not part of a toolkit.
        taskTimeoutSeconds:
          type: integer
          minimum: 1
          description: Absolute platform execution deadline before timeout/refund; not media output duration.
        maxOutputDurationSeconds:
          type: integer
          minimum: 1
          description: Maximum output duration the model schema allows, taken from the `maximum` of its `duration_seconds` property; omitted when that property is absent or has no declared maximum. Distinct from `taskTimeoutSeconds`, which is the platform execution deadline.
        enabled:
          type: boolean
        available:
          type: boolean
          description: Whether the model can be called right now.
        quantityField:
          type: string
        credits:
          type: object
          description: "Price in credits (1 credit = $0.001), the same price popnow.ai shows. `unit` is how the price scales (`per_image`, `per_second`, `per_request`…), `perUnit` is the starting price per unit, and `rules` lists the tiers: each rule applies when the request matches its `when` values (`*` matches the field that sets the tier). Use jobs/quote for the exact amount of one request."
          required:
            - unit
            - perUnit
          properties:
            unit:
              type: string
            perUnit:
              type: number
              minimum: 0
            rules:
              type: array
              items:
                type: object
                required:
                  - when
                  - perUnit
                properties:
                  when:
                    type: object
                    additionalProperties: true
                  perUnit:
                    type: number
                    minimum: 0
                  unit:
                    type: string
          additionalProperties: true
        inputSchema:
          type: object
          description: "JSON Schema draft 2020-12 used by `createTask.input` validation and Playground rendering. Standard JSON Schema keywords validate. Presentation hints live only in a per-property `x-ui` object whose keys are snake_case and drawn from a closed set: `widget`, `order`, `label`, `placeholder`, `rows`, `step`, `unit`, `accept`, `max_size_mb`, `max_duration_seconds`, `max_total_duration_seconds`, `advanced`, `primary`, `affects_price`, `visible_when`, `enum_labels`, `reference_tokens`, `reference_sequence`, `reference_regions`, `mask`. `x-ui.order` is the only source of field order (descending first). `x-ui.widget` is one of `textarea`, `text`, `upload`, `multi-upload`, `select`, `radio`, `slider`, `number`, `switch`, `json`, `object-list`, `chat-messages`, `hidden`. Root-level composition is limited to `anyOf`, where every branch contains only `required`, and `allOf`, where each branch is `if` (`required` or `properties.*.const`) plus `then` (`required`); `oneOf`, `not` and `dependentSchemas` never appear. Unknown hints must be ignored."
          additionalProperties: true
        version:
          type: string
          description: Public model-catalog version label used to detect schema or metadata changes.
        availability:
          type: string
          enum:
            - planned
            - available
            - preview
            - maintenance
        badges:
          type: array
          description: Closed capability and licensing vocabulary; clients should ignore unknown future IDs.
          items:
            type: string
            enum:
              - commercial_use
              - no_watermark
              - commercial_restricted
              - reference_input
              - audio_output
              - fast_tier
              - high_resolution
        relatedModels:
          type: array
          description: Curated model identifiers suitable for alternatives or workflow steps.
          items:
            type: string
        examples:
          type: array
          description: A ready-to-run example input, the same one the API reference shows. Validated against this model's current input schema.
          items:
            $ref: "#/components/schemas/APIModelExample"
        updatedAt:
          type: string
          format: date-time
    APIModelExample:
      type: object
      required:
        - id
        - input
        - sortWeight
      properties:
        id:
          type: string
        input:
          type: object
          additionalProperties: true
        sortWeight:
          type: integer
    APIModelList:
      type: object
      required:
        - total
        - items
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/APIModel"
    ModelEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/APIModel"
    ModelListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/APIModelList"
    UploadURLRequest:
      type: object
      required:
        - contentType
        - bytes
      additionalProperties: false
      properties:
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
            - video/mp4
            - video/webm
            - audio/mpeg
            - audio/wav
            - application/pdf
            - application/msword
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/vnd.ms-excel
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - application/vnd.ms-powerpoint
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
            - application/vnd.apple.keynote
            - application/vnd.apple.pages
            - application/vnd.apple.numbers
            - text/plain
            - text/markdown
            - application/octet-stream
        bytes:
          type: integer
          minimum: 1
          maximum: 2147483648
          description: Images are limited to 10 MiB; supported audio/video and documents to 90 MiB; LoRA weights (application/octet-stream, a .safetensors file) to 2 GiB.
    UploadURLResponse:
      type: object
      required:
        - fileId
        - key
        - uploadUrl
        - method
        - headers
        - expiresAt
        - maxBytes
      properties:
        fileId:
          type: string
          pattern: ^fil_
        key:
          type: string
          pattern: ^popnow://f/fil_
          description: Compatibility alias for the final URI; unusable until commit succeeds.
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          const: PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
        maxBytes:
          type: integer
          minimum: 1
    UploadURLEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/UploadURLResponse"
    FileCommitResponse:
      type: object
      required:
        - fileId
        - status
        - bytes
        - contentType
        - sha256
        - uri
        - expiresAt
      properties:
        fileId:
          type: string
          pattern: ^fil_
        status:
          type: string
          const: ready
        bytes:
          type: integer
          minimum: 1
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
            - video/mp4
            - video/webm
            - audio/mpeg
            - audio/wav
            - application/pdf
            - application/msword
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/vnd.ms-excel
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - application/vnd.ms-powerpoint
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
            - application/vnd.apple.keynote
            - application/vnd.apple.pages
            - application/vnd.apple.numbers
            - text/plain
            - text/markdown
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        uri:
          type: string
          pattern: ^popnow://f/fil_
        expiresAt:
          type: string
          format: date-time
        durationSeconds:
          type: string
          description: Measured audio/video duration in seconds.
        width:
          type: integer
          minimum: 0
        height:
          type: integer
          minimum: 0
    FileCommitEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/FileCommitResponse"
    LoraImportRequest:
      type: object
      required:
        - url
      additionalProperties: false
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: Hugging Face repo id (owner/repo), a Hugging Face repo or file page, or a direct https link to a .safetensors file.
        token:
          type: string
          maxLength: 512
          description: Optional Hugging Face access token or Civitai API key, used only for this download and never stored.
    DownloadURLRequest:
      type: object
      required:
        - taskId
      additionalProperties: false
      properties:
        taskId:
          type: string
          minLength: 1
        key:
          type: string
          description: Optional output key; empty selects the first output.
    DownloadURLResponse:
      type: object
      required:
        - key
        - url
        - expiresAt
      properties:
        key:
          type: string
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    DownloadURLEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/DownloadURLResponse"
    AssetCreateRequest:
      type: object
      additionalProperties: false
      required:
        - source
      properties:
        source:
          type: string
          enum:
            - task_output
            - upload
            - url
        taskId:
          type: string
          description: "source=task_output: one of your own successful tasks."
        key:
          type: string
          description: "source=task_output: the output key. Send key or index."
        index:
          type: integer
          minimum: 0
          description: "source=task_output: zero-based position in output.assets. Send key or index."
        fileId:
          type: string
          description: "source=upload: a committed upload (fil_… or popnow://f/fil_…)."
        url:
          type: string
          maxLength: 2048
          description: "source=url: a public http or https address on port 80 or 443, without credentials."
        name:
          type: string
          maxLength: 80
          description: Defaults to "Saved asset".
    Asset:
      type: object
      required:
        - id
        - uri
        - name
        - kind
        - contentType
        - bytes
        - source
        - sourceId
        - createdAt
        - updatedAt
        - previewUrl
        - favorite
        - model
        - modelName
      properties:
        id:
          type: string
          pattern: ^ast_
        uri:
          type: string
          pattern: ^popnow://a/ast_
          description: Stable reference. Works only in generation requests made with keys of the same workspace; it is never a downloadable link.
        name:
          type: string
          maxLength: 80
        kind:
          type: string
          enum:
            - image
            - video
            - audio
        contentType:
          type: string
        bytes:
          type: integer
          minimum: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        durationSeconds:
          type: number
          exclusiveMinimum: 0
        source:
          type: string
          enum:
            - task_output
            - upload
            - url
        sourceId:
          type: string
          description: Your task or upload id; for url, an opaque digest of the address (the address itself is not stored).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        previewUrl:
          type: string
          description: Private preview signed for you for at most 20 minutes; empty when signing fails. Do not store or share it — persist uri instead.
        previewUrlExpiresAt:
          type: string
          format: date-time
        favorite:
          type: boolean
          description: Favorite mark of the library (shared by everyone in a team).
        model:
          type: string
          description: Public name of the model that generated the asset, for example bytedance/seedream-5.0-pro/text-to-image; empty for uploads and links.
        modelName:
          type: string
          description: Display name of that model; empty when the asset was not generated or the name is unknown.
    AssetEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/Asset"
    AssetEntity:
      type: object
      required:
        - id
        - kind
        - name
        - note
        - coverAssetId
        - cover
        - assets
        - count
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - character
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: Unique within the library and kind (case-insensitive).
        note:
          type: string
          maxLength: 280
        coverAssetId:
          type: string
          description: Empty while the character has no images.
        cover:
          oneOf:
            - $ref: "#/components/schemas/Asset"
            - type: "null"
        assets:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Asset"
          description: The character's images in order.
        count:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssetEntityEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/AssetEntity"
    AssetEntityListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/AssetEntity"
                nextCursor:
                  type: string
                  description: Absent on the last page.
    AssetList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        nextCursor:
          type: string
          description: Absent on the last page.
    AssetListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/AssetList"
    AssetPlan:
      type: object
      required:
        - id
        - name
        - minTopupUsd
        - maxBytes
        - maxCount
        - maxFileBytes
      properties:
        id:
          type: string
          description: Lowercase plan key, for example free, plus, pro, studio, max.
        name:
          type: string
          description: Plan name, for example Free, Plus, Pro, Studio or Max.
        minTopupUsd:
          type: string
          description: Lifetime top-ups in USD that unlock this plan.
        maxBytes:
          type: integer
          minimum: 0
          description: Total storage in bytes (binary units). 0 means saving is closed on this plan.
        maxCount:
          type: integer
          minimum: 0
        maxFileBytes:
          type: integer
          minimum: 0
    AssetScope:
      type: object
      required:
        - workspaceId
        - personal
        - role
        - canWrite
        - canTopUp
      properties:
        workspaceId:
          type: string
          description: "The workspace whose library this is: your personal workspace, or the team. Empty for an account that has no personal workspace yet."
        personal:
          type: boolean
        role:
          type: string
          enum:
            - owner
            - admin
            - developer
            - billing
            - readonly
          description: Always owner for a personal library. For a team key, the current role of the member who created it.
        canWrite:
          type: boolean
          description: Whether new assets can be saved here (owner, admin and developer).
        canTopUp:
          type: boolean
          description: "Whether the caller can see and raise the owner's allowance: only the owner (personal library, or a team key the owner created). Billing members cannot top up for the owner."
    AssetQuota:
      type: object
      required:
        - tier
        - usage
        - limits
        - full
        - nextTier
        - tiers
        - dailyCreateLimit
        - createdToday
        - scope
      properties:
        tier:
          $ref: "#/components/schemas/AssetPlan"
        usage:
          type: object
          required:
            - count
            - bytes
          properties:
            count:
              type: integer
              minimum: 0
            bytes:
              type: integer
              minimum: 0
        limits:
          type: object
          required:
            - tier
            - maxCount
            - maxBytes
            - maxFileBytes
            - globalMaxBytes
            - nameMaxChars
          properties:
            tier:
              type: string
            maxCount:
              type: integer
              minimum: 0
            maxBytes:
              type: integer
              minimum: 0
            maxFileBytes:
              type: integer
              minimum: 0
            globalMaxBytes:
              type: integer
              minimum: 0
              description: Platform-wide ceiling; 0 disables it.
            nameMaxChars:
              type: integer
              const: 80
        full:
          type: boolean
          description: True when no new asset fits (including plans where saving is closed).
        nextTier:
          oneOf:
            - $ref: "#/components/schemas/AssetPlan"
            - type: "null"
          description: The next plan with more storage or items; null on the highest plan.
        topupToNextTierUsd:
          type: string
          description: How much more to top up, in USD, to reach nextTier. Omitted when scope.canTopUp is false.
        lifetimeTopupUsd:
          type: string
          description: The owner's lifetime top-ups in USD as a decimal string, for example "25" or "12.50". Omitted when scope.canTopUp is false.
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/AssetPlan"
        dailyCreateLimit:
          type: integer
          minimum: 1
          description: New assets allowed per owner allowance per UTC day.
        createdToday:
          type: integer
          minimum: 0
        scope:
          $ref: "#/components/schemas/AssetScope"
    AssetQuotaEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/AssetQuota"
    AssetDeletedEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              type: object
              required:
                - id
                - deleted
              properties:
                id:
                  type: string
                deleted:
                  type: boolean
                  const: true
    USDString:
      type: string
      pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
      description: Decimal USD amount encoded as a string to avoid binary floating-point loss.
    OpenAIErrorBody:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
            - code
          properties:
            message:
              type: string
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - insufficient_quota
                - rate_limit_error
                - server_error
            param:
              type:
                - string
                - "null"
              description: The request field the error is about, as a dot path (for example `seconds`, `input_reference`). `null` when the error is not about a single field.
            code:
              type: string
              description: Stable machine-readable reason, for example `invalid_request`, `unsupported_parameter` (the model does not accept this field or value), `content_rejected` (the model's content policy refused the request; HTTP 400, and retrying the same input will be refused again), `model_not_found`, `invalid_api_key`, `insufficient_balance`, `model_not_allowed`, `model_unavailable`, `rate_limit_exceeded`, `upstream_failed`.
    OpenAIModelList:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            required:
              - id
              - object
              - created
              - owned_by
            properties:
              id:
                type: string
                description: Model call name; may contain slashes.
              object:
                type: string
                const: model
              created:
                type: integer
                description: Unix seconds of the last catalog update.
              owned_by:
                type: string
                description: Model publisher.
              modality:
                type: string
                enum:
                  - image
                  - video
                  - audio
                description: PopNow extension. Output modality.
              task:
                type: string
                description: PopNow extension. The task this call name runs, for example `text-to-video`.
    VideoCreateRequest:
      type: object
      required:
        - model
        - prompt
      additionalProperties: false
      properties:
        model:
          type: string
          description: Video endpoint identifier from `/v1/models`.
        prompt:
          type: string
        input_reference:
          type: string
          description: Reference image URL; mapped to the model's `image_url` / `image_urls`.
        seconds:
          oneOf:
            - type: string
            - type: integer
          description: Clip length in seconds; mapped to `duration_seconds`.
        size:
          type: string
          pattern: ^[0-9]+x[0-9]+$
          description: WIDTHxHEIGHT, mapped to `resolution` / `aspect_ratio` (or `width` / `height`).
    Video:
      type: object
      required:
        - id
        - object
        - model
        - status
        - progress
        - created_at
      properties:
        id:
          type: string
          description: Task identifier; also accepted by `/api/v1/jobs/recordInfo`.
        object:
          type: string
          const: video
        model:
          type: string
        status:
          type: string
          enum:
            - queued
            - in_progress
            - completed
            - failed
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 100 when completed, otherwise 0; no fabricated intermediate values.
        created_at:
          type: integer
        completed_at:
          type: integer
        seconds:
          type: string
        size:
          type: string
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
