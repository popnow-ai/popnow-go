        input:
          type: object
          description: Validated against the selected model's inputSchema (`GET /api/v1/models/{model}`). Declared media fields accept public HTTPS URLs, committed popnow://f/<id> file URIs (common/upload-url, then the file commit endpoint), saved assets as popnow://a/<id> in the media field of the matching kind (the asset must be in the library of the key's workspace; any other asset gets the same rejection as an unknown id), or standard Base64 Data URIs (image/jpeg, image/png, image/webp, image/gif). Inline images are limited to 1048576 decoded bytes and 8388608 pixels each, 8192 pixels per side, and 16 images / 16777216 pixels in total. The complete JSON request must fit within 2097152 bytes. Model-specific limits still apply. Bare Base64, SVG and inline audio/video are not accepted; use HTTPS or file uploads instead. Inline images are stored as account-bound uploaded files; returned input contains file URIs, never the original Base64 bytes. Quote validation does not upload or hold funds. If the model's inputSchema declares `seed` and you omit it, we pick a random seed for this task, so two identical requests do not come back with the same output. The chosen seed is returned in the task's `input`; pass it back to hold the draw steady (a fixed seed keeps runs comparable, it does not guarantee an identical result). A `seed` you send yourself is always used as given.
          additionalProperties: true
        callBackUrl:
          type: string
          format: uri
          description: "Optional public HTTPS endpoint for terminal task delivery. `http://` URLs are rejected: the delivery carries the prompt and signed result links. Explicit ports other than 443 and 80 are rejected, and URL credentials are rejected. The hostname must resolve to public IP addresses and is checked again when connecting. Invalid values return HTTP 400 with code 400, msg \"Invalid callback URL\", and request_id."
        quoteId:
          type: string
          maxLength: 4096
          description: Signed quote returned by jobs/quote for this same account, API key and request. Does not replace Idempotency-Key.
        expectedCost:
          allOf:
            - $ref: "#/components/schemas/USDString"
          description: Legacy name for expectedCostUsd; an exact USD decimal string. Both names must match when supplied together.
          deprecated: true
        expectedCredits:
          type: integer
          format: int64
          minimum: 0
          description: Deprecated integer display projection (1 credit = $0.001). With quoteId or an explicit USD amount, it must equal ceil(confirmed USD / 0.001); it never overrides the exact amount. Alone it confirms exactly expectedCredits × $0.001, so use quoteId or expectedCostUsd for fractional-USD quotes. Send maxCredits, not the quote response's typical expectedCredits.
          deprecated: true
        metadata:
          type: object
          maxProperties: 16
          additionalProperties:
            type: string
            maxLength: 256
          description: "Optional key-value pairs for your own bookkeeping (for example an order ID or your end user's ID): at most 16 keys of up to 40 characters, string values of up to 256 characters, and at most 4096 bytes encoded. Stored with the task and shown in the console log detail; never sent to the model and never part of the price or of the Idempotency-Key fingerprint. Removed together with the prompt when the task content is deleted or expires. Invalid metadata returns 400 before anything is reserved."
        expectedCostUsd:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
          description: Recommended exact USD hold confirmation. Send maxChargeUsd from jobs/quote, or send quoteId alone. Up to nine decimal places; no exponent notation. When expectedCost is also supplied, both USD values must match.
    TaskQuoteResponse:
      type: object
      required:
        - quoteId
        - model
        - estimatedCost
        - maxCharge
        - currency
        - quantity
        - unit
        - expiresAt
        - maxCredits
        - expectedCredits
        - maxChargeUsd
        - expectedChargeUsd
        - expectedCharge
      additionalProperties: false
      properties:
        quoteId:
          type: string
        model:
          type: string
          description: Resolved endpoint model identifier.
        estimatedCost:
          $ref: "#/components/schemas/USDString"
        maxCharge:
          $ref: "#/components/schemas/USDString"
        maxCredits:
          type: integer
          format: int64
          minimum: 0
          description: Legacy display projection at 1 credit = $0.001. Integer values round upward; use the USD fields for exact amounts and reconciliation.
          deprecated: true
        expectedCredits:
          type: integer
          format: int64
          minimum: 0
          description: Legacy display projection at 1 credit = $0.001. Integer values round upward; use the USD fields for exact amounts and reconciliation.
          deprecated: true
        currency:
          type: string
          const: USD
        quantity:
          type: string
          description: Estimated billable quantity.
        unit:
          type: string
        expiresAt:
          type: string
          format: date-time
        maxChargeUsd:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
          description: Exact maximum USD charge and amount held on acceptance; same value as maxCharge and estimatedCost. Recommended for expectedCostUsd.
        expectedChargeUsd:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
          description: Exact typical USD charge, never above maxChargeUsd. Informational; do not use the typical charge to confirm the maximum hold.
        expectedCharge:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
          description: Legacy USD alias of expectedChargeUsd.
    TaskQuoteEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/TaskQuoteResponse"
    CreateTaskResponse:
      type: object
      required:
        - taskId
        - state
        - estimatedCost
        - deadlineAt
        - estimatedCredits
        - estimatedCostUsd
      properties:
        taskId:
          type: string
        deadlineAt:
          type: string
          format: date-time
          description: Server execution deadline fixed at acceptance; not a local wait timeout or result URL expiry. Idempotent replays retain the original deadline.
        state:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - canceled
            - expired
          description: "`queued` for a new submission; an idempotent replay reports the original task's current state."
        estimatedCost:
          allOf:
            - $ref: "#/components/schemas/USDString"
          description: Funds held when the task is accepted and the maximum customer charge for that task. Unused funds are released and no later amount is collected above the hold.
        estimatedCredits:
          type: integer
          format: int64
          minimum: 0
          description: Legacy display projection at 1 credit = $0.001. Integer values round upward; use the USD fields for exact amounts and reconciliation.
          deprecated: true
        estimatedCostUsd:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
          description: Exact USD held on acceptance. Same as estimatedCost; unused held funds are released at settlement.
    TaskActionRequest:
      type: object
      required:
        - taskId
      additionalProperties: false
      properties:
        taskId:
          type: string
          minLength: 1
    RetryTaskResponse:
      allOf:
        - $ref: "#/components/schemas/CreateTaskResponse"
        - type: object
          required:
            - sourceTaskId
          properties:
            sourceTaskId:
              type: string
    RetryTaskEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/RetryTaskResponse"
    TaskPurgeResponse:
      type: object
      required:
        - taskId
        - contentState
        - billingRetained
        - mediaDeletionPending
      properties:
        taskId:
          type: string
        contentState:
          type: string
          enum:
            - present
            - expired
            - purged
          description: "`purged` after a successful destroy, and on any idempotent repeat. Still `present` means this call removed nothing and may be retried later; the reason is deliberately not disclosed."
        purgedAt:
          type: string
          format: date-time
          description: Time of the **first** destroy, not of this call.
        contentRemovedBy:
          type: string
          enum:
            - user
            - system
          description: Omitted while `contentState` is `present`.
        billingRetained:
          type: boolean
          const: true
          description: Always true. Destroying content never changes the ledger, the charged amount, or any other billing fact. It is stated explicitly because it is the one thing a caller is likely to get wrong about an endpoint named "purge".
        mediaDeletionPending:
          type: boolean
          description: True while the background sweep has not finished removing the stored media objects.
    TaskPurgeEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/TaskPurgeResponse"
    CreateTaskEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/CreateTaskResponse"
    TaskOutput:
      type: object
      additionalProperties: true
      description: First-party result metadata. Ready assets include directly usable temporary URLs; no download-ticket request is needed. Poll again to refresh an expired URL. Temporary URLs are bearer access grants; never attach your API key when fetching them.
      properties:
        text:
          type: string
          description: Text result (transcription). For transcription with multichannel on, one line per channel in channel order.
        transcript:
          $ref: "#/components/schemas/TaskTranscript"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/TaskOutputAsset"
    TaskTranscript:
      type: object
      description: Structured transcription result, present only on speech-to-text endpoints that return it. `text` above stays the plain transcript; this object adds timing and language details. Erased together with the rest of the task output on the prompt-retention schedule.
      properties:
        text:
          type: string
          description: Full transcript.
        language:
          type: string
          description: Detected language, as reported by the model (for example en).
        languageCode:
          type: string
          description: Detected language code (ISO 639-3, for example eng) when available.
        languageProbability:
          type: number
          description: Confidence of the detected language, 0 to 1, when available.
        durationSeconds:
          type: number
          description: Length of the transcribed audio in seconds.
        words:
          type: array
          items:
            $ref: "#/components/schemas/TaskTranscriptWord"
        channels:
          type: array
          description: Present when multichannel transcription was requested; one entry per audio channel.
          items:
            $ref: "#/components/schemas/TaskTranscriptChannel"
    TaskTranscriptWord:
      type: object
      required:
        - text
        - start
        - end
      properties:
        text:
          type: string
        start:
          type: number
          description: Start time in seconds from the beginning of the audio.
        end:
          type: number
          description: End time in seconds.
        type:
          type: string
          description: Segment type (for example word) when the model reports one.
        speakerId:
          type: string
          description: Speaker label; only present when the model performs speaker separation.
    TaskTranscriptChannel:
      type: object
      required:
        - index
      properties:
        index:
          type: integer
          description: Zero-based channel index.
        text:
          type: string
        language:
          type: string
        languageCode:
          type: string
        words:
          type: array
          items:
            $ref: "#/components/schemas/TaskTranscriptWord"
    TaskOutputAsset:
      type: object
      additionalProperties: true
      properties:
        key:
          type: string
          description: Compatibility identifier for optional download-url requests.
        url:
          type: string
          format: uri
          description: First-party signed GET URL on PopNow storage, normally valid for 20 minutes. Absent while pending or unavailable. Request a fresh one with recordInfo or common/download-url after it expires.
        expiresAt:
          type: string
          format: date-time
          description: Expiry of this URL, not the result retention deadline.
        mime:
          type: string
        width:
          type: integer
        height:
          type: integer
        durationSeconds:
          type: number
        bytes:
          type: integer
          format: int64
        role:
          type: string
          description: "What the asset is: `video`, `image`, `audio` or a model-specific role. Video extend endpoints that join the source clip to the new footage return two assets in a fixed order: the joined clip first (`video`), then the newly generated part on its own (`segment`). Endpoints that return only the new part have no `segment` asset. Video translation endpoints return the dubbed clip (`video`) and, where the model produces one, a subtitle file of the translated speech (`subtitle`, `mime` `application/x-subrip`, an `.srt` file); the subtitle is kept for the same retention period as the video."
        pending:
          type: boolean
        unavailable:
          type: boolean
        deleted:
          type: boolean
          description: "PopNow only: the owner permanently deleted this output (one output of a multi-output task). Always comes with unavailable true and no key or url; the stored file is being deleted."
        layer:
          type: object
          description: Present only on layer decomposition results. The first asset is the base image (the source with the separated elements removed, `zIndex` 0); every other asset is one transparent PNG layer. Stack them by ascending `zIndex` to rebuild the picture. `boundingBox` is `[x1, y1, x2, y2]` in base-image pixels and places the layer on the base (scale the layer to that box); it is absent on the base image and on models that do not report positions, in which case the layers can still be used as standalone cut-outs. `name` is the model's label for the layer when it gives one.
          required:
            - zIndex
          properties:
            zIndex:
              type: integer
              minimum: 0
            name:
              type: string
            boundingBox:
              type: array
              minItems: 4
              maxItems: 4
              items:
                type: integer
                minimum: 0
    TaskRecord:
      type: object
      required:
        - taskId
        - model
        - state
        - cost
        - settled
        - createdAt
        - credits
        - exactCredits
        - costUsd
      properties:
        taskId:
          type: string
        sourceTaskId:
          type: string
          description: Present when this task was created by explicit retry.
        model:
          type: string
          description: Model call name, `<publisher>/<model>/<task>`.
        state:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
            - canceled
            - expired
        input:
          description: Normalized model input; inline images become account-bound file URIs. Includes the random `seed` we picked when you omitted one (see CreateTaskRequest.input). Omitted after retention redaction.
          type: object
          additionalProperties: true
        output:
          $ref: "#/components/schemas/TaskOutput"
        errorCode:
          type: string
          description: "Stable PopNow failure identifier from a closed set; never an internal diagnostic code. The set is closed: any other value a client sees should be handled as `upstream_failed`."
          enum:
            - invalid_request
            - unsupported_combination
            - content_rejected
            - rate_limited
            - upstream_unavailable
            - generation_failed
            - timeout
            - invalid_asset
            - upstream_failed
        errorMessage:
          type: string
          description: Human-readable failure reason. When the model service reported a specific reason (for example a corrupted reference image or a copyright restriction on generated audio), that reason is returned in English with internal service names, hosts, URLs, request and task IDs, error-code suffixes and account or billing details removed; otherwise a normalized message that follows the same language selection as `msg`. `errorCode` never changes and remains the value to branch on.
        cost:
          $ref: "#/components/schemas/USDString"
        credits:
          type: integer
          format: int64
          minimum: 0
          description: Legacy display projection at 1 credit = $0.001. Integer values round upward; use the USD fields for exact amounts and reconciliation.
          deprecated: true
        exactCredits:
          type: string
          pattern: "^[0-9]+(\\\\.[0-9]+)?$"
          description: Legacy unrounded credit-scale decimal string (USD × 1000). Use cost/costUsd for USD amounts.
          deprecated: true
        settled:
          type: boolean
          description: When false, `cost` is the held estimate. When true, `cost` is the final charge. On success the final charge is capped at that hold; unused funds are released. Failed or expired tasks normally release the hold in full; the one exception is a `content_rejected` task on a model whose page states that such refusals are billed, which is settled at the accepted estimate.
        createdAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
          description: Server execution deadline. Present in current responses; historical stored webhook events may omit it. Not the result retention or URL expiry time.
        completedAt:
          type: string
          format: date-time
        contentState:
          type: string
          enum:
            - present
            - expired
            - purged
          description: "Whether the task content is still stored, and why it is not. `expired` means the retention policy removed it; `purged` means the account owner destroyed it with `purgeTask`. The two are deliberately distinct: telling a customer their own deletion was an expiry reads as the platform losing their data."
        contentRemovedBy:
          type: string
          enum:
            - user
            - system
          description: Present only once content has been removed. Omitted while `contentState` is `present`.
        purgedAt:
          type: string
          format: date-time
          description: Present only for a task destroyed with `purgeTask`. Expiry does not set it.
        retention:
          $ref: "#/components/schemas/TaskRetention"
        costUsd:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
          description: Exact USD charge when settled, otherwise the exact hold. Same as cost; recommended for reconciliation.
    TaskRetention:
      type: object
      description: When this task's content is scheduled to be removed, and which layer decided it. Omitted for tasks created before per-task retention existed; those follow the platform maximum.
      required:
        - outputsExpireAt
        - promptsExpireAt
        - source
      properties:
        outputsExpireAt:
          type: string
          format: date-time
          description: When the generated media objects and the result payload are removed. Before the task finishes this is measured from acceptance; when the task reaches a terminal state it is re-based on the completion time using the same window, so it only ever moves later, never earlier.
        promptsExpireAt:
          type: string
          format: date-time
          description: When the stored request text is erased. The task row, its state, amounts and request_id remain.
        source:
          type: string
          enum:
            - header
            - account
            - platform
          description: "Which layer actually constrained the value: the per-request `X-PopNow-Retention` header, the account setting, or the platform maximum. A request that sends the header and still sees `account` has an account setting that is already shorter than it asked for."
    TaskRecordEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/TaskRecord"
    APIKeyTaskItem:
      type: object
