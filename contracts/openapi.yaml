        stream:
          type: boolean
          default: false
    ResponseObject:
      type: object
      required:
        - id
        - object
        - created_at
        - status
        - model
        - output
      properties:
        id:
          type: string
        object:
          type: string
          const: response
        created_at:
          type: integer
        status:
          type: string
          enum:
            - completed
            - incomplete
            - in_progress
        model:
          type: string
        output:
          type: array
          items:
            type: object
            required:
              - id
              - type
              - status
            properties:
              id:
                type: string
              type:
                type: string
                enum:
                  - message
                  - function_call
              status:
                type: string
              role:
                type: string
              content:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      const: output_text
                    text:
                      type: string
                    annotations:
                      type: array
                      items:
                        type: object
              call_id:
                type: string
              name:
                type: string
              arguments:
                type: string
        error:
          type: "null"
        incomplete_details:
          type:
            - object
            - "null"
          properties:
            reason:
              type: string
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
            total_tokens:
              type: integer
    GeminiGenerateContentRequest:
      type: object
      required:
        - contents
      description: Google Gemini `generateContent` request. Which generation parameters a model accepts comes from that model's `inputSchema` in `/v1/models` and the catalog. Sampling parameters the model does not declare (temperature, topP, topK, penalties) are ignored and listed in the `X-PopNow-Ignored-Params` response header; any other unsupported parameter returns 400.
      properties:
        contents:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - user
                  - model
              parts:
                type: array
                items:
                  type: object
                  description: One of `text`, `inlineData {mimeType,data}`, `fileData {mimeType,fileUri}`, `functionCall {name,args}`, `functionResponse {name,response}`.
        systemInstruction:
          type: object
        tools:
          type: array
          items:
            type: object
        toolConfig:
          type: object
        generationConfig:
          type: object
          properties:
            temperature:
              type: number
            topP:
              type: number
            maxOutputTokens:
              type: integer
            stopSequences:
              type: array
              items:
                type: string
            responseMimeType:
              type: string
            responseSchema:
              type: object
            thinkingConfig:
              type: object
    GeminiGenerateContentResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              content:
                type: object
                properties:
                  role:
                    type: string
                  parts:
                    type: array
                    items:
                      type: object
              finishReason:
                type: string
        usageMetadata:
          type: object
          properties:
            promptTokenCount:
              type: integer
            candidatesTokenCount:
              type: integer
            totalTokenCount:
              type: integer
            cachedContentTokenCount:
              type: integer
            thoughtsTokenCount:
              type: integer
        modelVersion:
          type: string
          description: The PopNow model identifier.
        responseId:
          type: string
    GeminiErrorBody:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - status
          properties:
            code:
              type: integer
            message:
              type: string
            status:
              type: string
            details:
              type: array
              description: "One `google.rpc.ErrorInfo` whose `reason` is the upper-case form of the OpenAI-shape `error.code` (for example `CONTENT_REJECTED`, `UNSUPPORTED_PARAMETER`, `INVALID_REQUEST`) and whose `domain` is `api.popnow.ai`. `status` alone cannot tell a content-policy refusal from a bad parameter: both are `INVALID_ARGUMENT`."
              items:
                type: object
                required:
                  - "@type"
                  - reason
                  - domain
                properties:
                  "@type":
                    type: string
                    const: type.googleapis.com/google.rpc.ErrorInfo
                  reason:
                    type: string
                  domain:
                    type: string
    AnthropicMessageRequest:
      type: object
      required:
        - model
        - messages
        - max_tokens
      properties:
        model:
          type: string
        system:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum:
                  - user
                  - assistant
              content:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
        max_tokens:
          type: integer
        temperature:
          type: number
        top_p:
          type: number
        top_k:
          type: integer
        stop_sequences:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            type: object
        tool_choice:
          type: object
          description: "`disable_parallel_tool_use: true` is translated to `parallel_tool_calls: false`."
        stream:
          type: boolean
          default: false
    AnthropicMessage:
      type: object
      required:
        - id
        - type
        - role
        - model
        - content
        - stop_reason
        - usage
      properties:
        id:
          type: string
        type:
          type: string
          const: message
        role:
          type: string
          const: assistant
        model:
          type: string
        content:
          type: array
          items:
            type: object
            required:
              - type
            properties:
              type:
                type: string
                enum:
                  - text
                  - tool_use
              text:
                type: string
              id:
                type: string
              name:
                type: string
              input:
                type: object
        stop_reason:
          type: string
          enum:
            - end_turn
            - max_tokens
            - tool_use
        stop_sequence:
          type: "null"
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
    VideoCreateRequest:
      type: object
      required:
        - model
        - prompt
      additionalProperties: false
      properties:
        model:
          type: string
          description: Video endpoint identifier from `/v1/models`.
        prompt:
          type: string
        input_reference:
          type: string
          description: Reference image URL; mapped to the model's `image_url` / `image_urls`.
        seconds:
          oneOf:
            - type: string
            - type: integer
          description: Clip length in seconds; mapped to `duration_seconds`.
        size:
          type: string
          pattern: ^[0-9]+x[0-9]+$
          description: WIDTHxHEIGHT, mapped to `resolution` / `aspect_ratio` (or `width` / `height`).
    Video:
      type: object
      required:
        - id
        - object
        - model
        - status
        - progress
        - created_at
      properties:
        id:
          type: string
          description: Task identifier; also accepted by `/api/v1/jobs/recordInfo`.
        object:
          type: string
          const: video
        model:
          type: string
        status:
          type: string
          enum:
            - queued
            - in_progress
            - completed
            - failed
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 100 when completed, otherwise 0; no fabricated intermediate values.
        created_at:
          type: integer
        completed_at:
          type: integer
        seconds:
          type: string
        size:
          type: string
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    SavedRecipe:
      type: object
      required:
        - id
        - kind
        - name
        - mine
        - media
        - inputs
        - steps
        - currency
        - updatedAt
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - recipe
            - workflow
        name:
          type: string
        mine:
          type: boolean
        teamId:
          type: string
          description: The team that shared it (only on items that aren't yours).
        media:
          type: string
          enum:
            - image
            - video
            - audio
        inputs:
          type: array
          items:
            type: object
            required:
              - id
              - media
              - multiple
              - required
            properties:
              id:
                type: string
              label:
                type: string
              media:
                type: string
                enum:
                  - image
                  - video
                  - audio
                  - text
              multiple:
                type: boolean
              required:
                type: boolean
                description: No material was saved for it, so a run must give one.
        steps:
          type: integer
        currency:
          type: string
          const: USD
        estimated_usd:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
          description: Optional exact USD estimate; omitted when unavailable. Not an execution approval.
        prompt:
          type: string
          description: Only for your own recipes.
        updatedAt:
          type: string
          format: date-time
    SavedUSDRun:
      type: object
      required:
        - currency
        - cost_usd
        - available_usd
        - spent_usd
        - needs_confirmation
      properties:
        currency:
          type: string
          const: USD
        cost_usd:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
          description: Quoted steps total, incomplete when unpriced_steps is present. Resume quotes include committed amounts plus remaining steps. Status reads report current step estimates.
        available_usd:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]{1,9})?$"
          description: Independent API wallet available balance.
        spent_usd:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]{1,9})?$"
          description: Net actual charge from the original API payer ledger on status reads; zero in quote/start responses.
        max_usd:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
          description: Approved total budget, when present.
        quote_id:
          type: string
          description: Fingerprint binding steps, inputs, prices and original identity.
        needs_confirmation:
          type: boolean
        unpriced_steps:
          type: array
          items:
            type: string
          description: Step IDs not yet priceable because required dependency outputs are missing. These steps cannot run; zero is not a free price.
        run_id:
          type: string
        state:
          type: string
          enum:
            - draft
            - running
            - paused
            - done
            - stopped
            - failed
        pause_reason:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - stepId
              - state
            properties:
              stepId:
                type: string
              state:
                type: string
              jobId:
                type: string
              uri:
                type: string
    SavedSkill:
      type: object
      required:
        - id
        - name
        - description
        - mine
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        mine:
          type: boolean
        shareMode:
          type: string
          enum:
            - use
            - view
        body:
          type: string
    AgentSkill:
      type: object
      required:
        - slug
        - name
        - summary
        - bestFor
        - type
        - tasks
        - popnow
        - popnowRequired
        - requires
        - version
        - updated
        - url
        - preview
        - distribution
      properties:
        slug:
          type: string
        name:
          type: string
        summary:
          type: string
        bestFor:
          type: array
          items:
            type: string
        type:
          type: string
          enum:
            - video
            - image
            - slides
            - web
        tasks:
          type: array
          items:
            type: string
        popnow:
          type: array
          description: Media the skill can generate through PopNow (each run is quoted first).
          items:
            type: string
            enum:
              - image
              - video
              - audio
        popnowRequired:
          type: boolean
          description: True when the skill can't finish without PopNow generation; false when those steps are optional.
        requires:
          type: array
          description: Tools the skill runs on the user's machine, for example python3, node, ffmpeg or chrome.
          items:
            type: string
        version:
          type: string
        updated:
          type: string
          format: date
        url:
          type: string
          format: uri
          description: The skill's page on popnow.ai.
        preview:
          type:
            - object
            - "null"
          properties:
            video:
              type: string
              format: uri
            image:
              type: string
              format: uri
        distribution:
          type: string
          enum:
            - popnow
            - github
          description: "`popnow` packages download from this API; `github` ones are open source (see `repo`)."
        repo:
          type: string
          format: uri
    AgentSkillDetail:
      allOf:
        - $ref: "#/components/schemas/AgentSkill"
        - type: object
          required:
            - install
          properties:
            install:
              type: object
              required:
                - folder
                - prompt
                - guide
                - agents
              properties:
                folder:
                  type: string
                  description: The single folder inside the package, popnow-<slug>.
                downloadPath:
                  type: string
                  description: Path of the download endpoint (absent for open-source skills).
                downloadUrl:
                  type: string
                  format: uri
                prompt:
                  type: string
                  description: A sentence to paste into an agent so it installs the skill itself.
                guide:
                  type: string
                  format: uri
                  description: Install steps written for agents.
                agents:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - name
                      - personalDir
                      - projectDir
                      - invoke
                      - docs
                      - command
                    properties:
                      id:
                        type: string
                        enum:
                          - claude-code
                          - codex
                          - cursor
                          - gemini-cli
                          - github-copilot
                          - windsurf
                          - openclaw
                          - antigravity
                          - opencode
                          - hermes-agent
                          - kimi-code
                          - kiro
                          - trae
                          - qoder
                          - qwen-code
                          - cline
                          - roo-code
                          - kilo-code
                          - amp
                          - zed
                          - warp
                          - goose
                          - junie
                          - codebuddy
                          - openhands
                          - devin
                          - minimax-code
                          - mistral-vibe
                      name:
                        type: string
                      personalDir:
                        type: string
                        description: Skills folder for every project.
                      projectDir:
                        type: string
                        description: Skills folder for the current repository only.
                      invoke:
                        type: string
                        description: How to call the skill in a chat with that agent.
                      docs:
                        type: string
                        format: uri
                      command:
                        type: string
                        description: Shell command that installs the skill into personalDir.
