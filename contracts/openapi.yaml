  /api/v1/recipes/{id}/run:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Recipes
      operationId: runRecipe
      summary: Run a saved recipe or workflow
      description: |
        Compiles the recipe on the server with your inputs and starts a run (one task per piece; a workflow runs its steps in order,
        each step using the earlier steps' results). Inputs you leave out use the material saved with the recipe.
        Media inputs take `popnow://g/<job>/<n>` (a result), `popnow://f/<file>` (an upload), `popnow://a/<asset>` (an API asset) or an
        https URL, or a list of them; the `prompt` input of a recipe (and text inputs of a workflow) take plain text.
        First send inputs/count without approval fields to obtain a quote; this does not create a run or hold funds.
        Confirm the same inputs/count with `currency: USD`, `max_usd` and `quote_id`, plus Idempotency-Key.
        Missing approval, a changed quote or a price above max_usd returns 200 with `needs_confirmation: true` and a fresh quote,
        without starting a run. Never automatically approve the new quote. Replaying an accepted Idempotency-Key returns the same run.
        The total budget is at most $10,000, with a $1,000 per-step limit. Old maxCredits/max_credits are rejected, including zero.
        Keys with model or spend limits are supported and checked on each step. Unpriced dependent steps cannot execute;
        after their required outputs become available, the run pauses for a new explicit approval via resume.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Required when confirming execution; omitted for quote-only requests.
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                inputs:
                  type: object
                  description: Input id → a reference, a list of references, or text.
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: array
                        maxItems: 10
                        items:
                          type: string
                count:
                  type: integer
                  minimum: 1
                  maximum: 4
                  description: How many pieces a recipe makes (workflows always run once).
                currency:
                  type: string
                  const: USD
                max_usd:
                  type: string
                  pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
                  description: Approved total USD budget, at most 10000. No exponent notation or numeric JSON values.
                quote_id:
                  type: string
                  description: Quote fingerprint returned by the quote-only request.
      responses:
        "200":
          description: A quote requiring confirmation, or the accepted run.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - msg
                  - data
                properties:
                  code:
                    type: integer
                    const: 200
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/SavedUSDRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
