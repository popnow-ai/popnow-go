          format: int64
          minimum: 0
        succeeded:
          type: integer
          format: int64
          minimum: 0
        failed:
          type: integer
          format: int64
          minimum: 0
        spend:
          $ref: "#/components/schemas/USDString"
        credits:
          type: integer
          format: int64
