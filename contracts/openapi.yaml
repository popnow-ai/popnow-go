        tokens in `usd` on `GET /api/v1/models` and `GET /v1/models`. When the request is accepted, the most it
        can cost is held from your balance, computed from the input and `max_tokens` (the model's maximum output when
        you omit it, so set `max_tokens` to keep holds small). When the reply ends you are charged its actual usage in
