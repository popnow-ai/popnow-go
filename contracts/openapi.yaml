                  type: string
                deleted:
                  type: boolean
                  const: true
    USDString:
      type: string
      pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
      description: Decimal USD amount encoded as a string to avoid binary floating-point loss.
    OpenAIErrorBody:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
            - code
          properties:
            message:
              type: string
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - insufficient_quota
                - rate_limit_error
                - server_error
            param:
              type:
                - string
                - "null"
              description: The request field the error is about, as a dot path (for example `seconds`, `input_reference`). `null` when the error is not about a single field.
            code:
              type: string
              description: Stable machine-readable reason, for example `invalid_request`, `unsupported_parameter` (the model does not accept this field or value), `content_rejected` (the model's content policy refused the request; HTTP 400, and retrying the same input will be refused again), `model_not_found`, `invalid_api_key`, `insufficient_balance`, `model_not_allowed`, `model_unavailable`, `rate_limit_exceeded`, `upstream_failed`.
    AnthropicErrorBody:
      type: object
      required:
        - type
        - error
      properties:
        type:
          type: string
          const: error
        error:
          type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
              enum:
                - invalid_request_error
                - authentication_error
                - billing_error
                - permission_error
                - not_found_error
                - request_too_large
                - rate_limit_error
                - api_error
                - overloaded_error
            message:
              type: string
            code:
              type: string
              description: "PopNow extension: the same stable reason as `error.code` in the OpenAI shape (for example `content_rejected`, `unsupported_parameter`, `invalid_request`). Official Anthropic SDKs ignore it; read it from the raw error body to tell a content-policy refusal from a bad parameter."
    OpenAIModelList:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            required:
              - id
              - object
              - created
              - owned_by
            properties:
              id:
                type: string
                description: Model call name; may contain slashes.
              object:
                type: string
                const: model
              created:
                type: integer
                description: Unix seconds of the last catalog update.
              owned_by:
                type: string
                description: Model publisher.
              modality:
                type: string
                enum:
                  - text
                  - image
                  - video
                  - audio
                description: PopNow extension. Output modality.
              task:
                type: string
                description: PopNow extension. The task this call name runs, for example `chat` or `text-to-video`. Only `chat` models work on the chat operations.
              context_length:
                type: integer
                description: PopNow extension, chat models only. The most input tokens one request can send.
              max_output_tokens:
                type: integer
                description: PopNow extension, chat models only. The largest `max_tokens` value the model accepts.
              supported_parameters:
                type: array
                items:
                  type: string
                description: "PopNow extension, chat models only. Request fields this model accepts (the top-level fields of its input schema). `stream`, `stream_options`, `user`, `metadata` and `store` are handled by the compatible layer for every model and are not listed. Any other field returns `400` with `code: unsupported_parameter`."
              credits:
                type: object
                description: Deprecated credit-scale rate snapshot; use usd for exact API prices.
                required:
                  - unit
                properties:
                  unit:
                    type: string
                  perUnit:
                    type: number
                    minimum: 0
                  blocks:
                    type: object
                    description: Duration is rounded up to whole billing blocks, subject to the stated minimum and cap. Refer to the model for whether duration means input or output.
                    required:
                      - seconds
                    properties:
                      seconds:
                        type: integer
                        minimum: 1
                      min:
                        type: integer
                        minimum: 1
                      cap:
                        type: integer
                        minimum: 1
                  input:
                    type: number
                    minimum: 0
                    description: Chat models only. Credits per 1M input tokens.
                  output:
                    type: number
                    minimum: 0
                    description: Chat models only. Credits per 1M output tokens (reasoning tokens count as output).
                  cachedInput:
                    type: number
                    minimum: 0
                    description: Chat models only. Credits per 1M cached input tokens.
                  cacheWrite:
                    type: number
                    minimum: 0
                    description: Chat models only. Credits per 1M tokens written to the prompt cache.
                  longContext:
                    type: object
                    description: Chat models only. Prices for requests whose input exceeds thresholdTokens (reaches it when inclusive is true).
                    properties:
                      thresholdTokens:
                        type: integer
                      inclusive:
                        type: boolean
                      input:
                        type: number
                        minimum: 0
                      cachedInput:
                        type: number
                        minimum: 0
                      cacheWrite:
                        type: number
                        minimum: 0
                      output:
                        type: number
                        minimum: 0
                  rules:
                    type: array
                    items:
                      type: object
                      required:
                        - when
                        - perUnit
                      properties:
                        when:
                          type: object
                          additionalProperties: true
                        perUnit:
                          type: number
                          minimum: 0
                        unit:
                          type: string
                additionalProperties: true
                deprecated: true
              usd:
                type: object
                description: USD rate snapshot. Monetary values are exact decimal strings; units, tier conditions and token thresholds retain their original meaning. Use jobs/quote for the authoritative current hold. No website-credit rounding applies.
                required:
                  - unit
                  - currency
                properties:
                  unit:
                    type: string
                  perUnit:
                    type: string
                  blocks:
                    type: object
                    description: Duration is rounded up to whole billing blocks, subject to the stated minimum and cap. Refer to the model for whether duration means input or output.
                    required:
                      - seconds
                    properties:
                      seconds:
                        type: integer
                        minimum: 1
                      min:
                        type: integer
                        minimum: 1
                      cap:
                        type: integer
                        minimum: 1
                  input:
                    type: string
                    description: Chat models only. USD per 1M input tokens.
                  output:
                    type: string
                    description: Chat models only. USD per 1M output tokens (reasoning tokens count as output).
                  cachedInput:
                    type: string
                    description: Chat models only. USD per 1M cached input tokens.
                  cacheWrite:
                    type: string
                    description: Chat models only. USD per 1M tokens written to the prompt cache.
                  longContext:
                    type: object
                    description: Chat models only. Prices for requests whose input exceeds thresholdTokens (reaches it when inclusive is true).
                    properties:
                      thresholdTokens:
                        type: integer
                      inclusive:
                        type: boolean
                      input:
                        type: string
                      cachedInput:
                        type: string
                      cacheWrite:
                        type: string
                      output:
                        type: string
                  rules:
                    type: array
                    items:
                      type: object
                      required:
                        - when
                        - perUnit
                      properties:
                        when:
                          type: object
                          additionalProperties: true
                        perUnit:
                          type: string
                        unit:
                          type: string
                  currency:
                    type: string
                    enum:
                      - USD
                additionalProperties: true
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
