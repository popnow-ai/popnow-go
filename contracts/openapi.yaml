        count:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssetEntityEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required:
            - data
          properties:
            code:
              type: integer
              const: 200
            msg:
              type: string
              const: success
            data:
              $ref: "#/components/schemas/AssetEntity"
    AssetEntityListEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
