    APIModel:
      type: object
      required:
        - model
        - family
        - displayName
        - provider
        - modality
        - tasks
        - async
        - taskTimeoutSeconds
        - enabled
        - available
        - quantityField
        - version
        - availability
        - badges
        - relatedModels
        - updatedAt
        - credits
        - usd
      properties:
        model:
          type: string
          description: Model call name in `<publisher>/<model>/<task>` form; the value `createTask.model` takes. Image editing uses the `edit` suffix.
          example: alibaba/wan-3.0/image-to-video
        family:
          type: string
          description: Stable product-family identifier; endpoint variants are listed in `tasks` and expressed by `inputSchema`.
        displayName:
          type: string
        provider:
          type: string
          description: Model creator/author identifier, such as the research lab that built the model.
        modality:
          type: string
          enum:
            - text
            - image
            - video
            - audio
        tasks:
          type: array
          items:
            type: string
          description: "The internal task classification of this one endpoint. Always exactly one element, and it is not always the suffix of `model`: image editing endpoints are published as `.../edit` but classified as `image-to-image` (or `image-edit` for single-purpose tools). Use `model` to call, and `tasks[0]` only to group or filter. New values appear as models are added, so treat the set as open."
        async:
          type: boolean
        toolkit:
          type: string
          enum:
            - subject-swap
            - studio-tools
          description: Which toolkit family this model belongs to (subject-swap for identity swaps; studio-tools for single-purpose image and video tools such as background removal or upscaling). Informational classification for catalogue grouping only; it does not participate in routing, pricing or authorization. Absent when the model is not part of a toolkit.
        taskTimeoutSeconds:
          type: integer
          minimum: 1
          description: Absolute platform execution deadline before timeout/refund; not media output duration.
        maxOutputDurationSeconds:
          type: integer
          minimum: 1
          description: Maximum output duration the model schema allows, taken from the `maximum` of its `duration_seconds` property; omitted when that property is absent or has no declared maximum. Distinct from `taskTimeoutSeconds`, which is the platform execution deadline.
        enabled:
          type: boolean
        available:
          type: boolean
          description: Whether the model can be called right now.
        quantityField:
          type: string
        credits:
          type: object
          description: Deprecated credit-scale rate snapshot retained for compatibility. It may lose precision; use usd and jobs/quote for API prices.
          required:
            - unit
          properties:
            unit:
              type: string
            perUnit:
              type: number
              minimum: 0
            blocks:
              type: object
              description: Duration is rounded up to whole billing blocks, subject to the stated minimum and cap. Refer to the model for whether duration means input or output.
              required:
                - seconds
              properties:
                seconds:
                  type: integer
                  minimum: 1
                min:
                  type: integer
                  minimum: 1
                cap:
                  type: integer
                  minimum: 1
            input:
              type: number
              minimum: 0
              description: Chat models only. Credits per 1M input tokens.
            output:
              type: number
              minimum: 0
              description: Chat models only. Credits per 1M output tokens (reasoning tokens count as output).
            cachedInput:
              type: number
              minimum: 0
              description: Chat models only. Credits per 1M cached input tokens.
            cacheWrite:
              type: number
              minimum: 0
              description: Chat models only. Credits per 1M tokens written to the prompt cache.
            longContext:
              type: object
              description: Chat models only. Prices for requests whose input exceeds thresholdTokens (reaches it when inclusive is true).
              properties:
                thresholdTokens:
                  type: integer
                inclusive:
                  type: boolean
                input:
                  type: number
                  minimum: 0
                cachedInput:
                  type: number
                  minimum: 0
                cacheWrite:
                  type: number
                  minimum: 0
                output:
                  type: number
                  minimum: 0
            rules:
              type: array
              items:
                type: object
                required:
                  - when
                  - perUnit
                properties:
                  when:
                    type: object
                    additionalProperties: true
                  perUnit:
                    type: number
                    minimum: 0
                  unit:
                    type: string
          additionalProperties: true
          deprecated: true
        inputSchema:
          type: object
          description: "JSON Schema draft 2020-12 used by `createTask.input` validation and Playground rendering. Standard JSON Schema keywords validate. Presentation hints live only in a per-property `x-ui` object whose keys are snake_case and drawn from a closed set: `widget`, `order`, `label`, `placeholder`, `rows`, `step`, `unit`, `accept`, `max_size_mb`, `max_duration_seconds`, `max_total_duration_seconds`, `advanced`, `primary`, `affects_price`, `visible_when`, `enum_labels`, `reference_tokens`, `reference_sequence`, `reference_regions`, `mask`. `x-ui.order` is the only source of field order (descending first). `x-ui.widget` is one of `textarea`, `text`, `upload`, `multi-upload`, `select`, `radio`, `slider`, `number`, `switch`, `json`, `object-list`, `chat-messages`, `hidden`. Root-level composition is limited to `anyOf`, where every branch contains only `required`, and `allOf`, where each branch is `if` (`required` or `properties.*.const`) plus `then` (`required`); `oneOf`, `not` and `dependentSchemas` never appear. Unknown hints must be ignored."
          additionalProperties: true
        version:
          type: string
          description: Public model-catalog version label used to detect schema or metadata changes.
        availability:
          type: string
          enum:
            - planned
            - available
            - preview
            - maintenance
        badges:
          type: array
          description: Closed capability and licensing vocabulary; clients should ignore unknown future IDs.
          items:
            type: string
            enum:
              - commercial_use
              - no_watermark
              - commercial_restricted
              - reference_input
              - audio_output
              - streaming
              - fast_tier
              - high_resolution
              - long_context
        relatedModels:
          type: array
          description: Curated model identifiers suitable for alternatives or workflow steps.
          items:
            type: string
        examples:
          type: array
          description: A ready-to-run example input, the same one the API reference shows. Validated against this model's current input schema.
          items:
            $ref: "#/components/schemas/APIModelExample"
        updatedAt:
          type: string
          format: date-time
        usd:
          type: object
          description: USD rate snapshot. Monetary values are exact decimal strings; units, tier conditions and token thresholds retain their original meaning. Use jobs/quote for the authoritative current hold. No website-credit rounding applies.
          required:
            - unit
            - currency
          properties:
            unit:
              type: string
            perUnit:
              type: string
            blocks:
              type: object
              description: Duration is rounded up to whole billing blocks, subject to the stated minimum and cap. Refer to the model for whether duration means input or output.
              required:
                - seconds
              properties:
                seconds:
                  type: integer
                  minimum: 1
                min:
                  type: integer
                  minimum: 1
                cap:
                  type: integer
                  minimum: 1
            input:
              type: string
              description: Chat models only. USD per 1M input tokens.
            output:
              type: string
              description: Chat models only. USD per 1M output tokens (reasoning tokens count as output).
            cachedInput:
              type: string
              description: Chat models only. USD per 1M cached input tokens.
            cacheWrite:
              type: string
              description: Chat models only. USD per 1M tokens written to the prompt cache.
            longContext:
              type: object
              description: Chat models only. Prices for requests whose input exceeds thresholdTokens (reaches it when inclusive is true).
              properties:
                thresholdTokens:
                  type: integer
                inclusive:
                  type: boolean
                input:
                  type: string
                cachedInput:
                  type: string
                cacheWrite:
                  type: string
                output:
                  type: string
            rules:
              type: array
              items:
                type: object
                required:
                  - when
                  - perUnit
                properties:
                  when:
                    type: object
                    additionalProperties: true
                  perUnit:
                    type: string
                  unit:
                    type: string
            currency:
              type: string
              enum:
                - USD
          additionalProperties: true
    APIModelExample:
