      description: |
        Only the original API key may resume a paused USD run. Send {} to get a new quote, then confirm currency/max_usd/quote_id.
        max_usd is the total approved budget including already spent and in-flight commitments, not an additional allowance.
        Original inputs, API key, payer and source country are preserved. Changed key IP policy requires a new run.
        Missing or stale approval returns needs_confirmation=true without resuming. No Idempotency-Key is required;
        a repeated call after successful resume returns conflict rather than restarting tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                currency:
                  type: string
                  const: USD
                max_usd:
                  type: string
                  pattern: "^[0-9]+(\\.[0-9]{1,9})?$"
                  description: Total approved USD budget, including spent and committed amounts; at most 10000.
                quote_id:
                  type: string
      responses:
        "200":
          description: A fresh quote or the resumed run.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - msg
                  - data
                properties:
                  code:
                    type: integer
                    const: 200
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/SavedUSDRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/skills:
    get:
      tags:
        - Recipes
      operationId: listSkills
      summary: List your Poppie skills
      description: Your own skills and the ones shared with a team you belong to. Read one to get its instructions.
      responses:
        "200":
          description: Your skills.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - msg
                  - data
                properties:
                  code:
                    type: integer
                    const: 200
                  msg:
                    type: string
                  data:
                    type: object
                    required:
                      - items
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/SavedSkill"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/skills/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Recipes
      operationId: getSkill
      summary: Read one skill's instructions
      description: |
        `body` is the skill's instructions (SKILL.md), returned for your own skills and for team skills shared as viewable. Skills shared as use-only have no `body`.
      responses:
        "200":
          description: The skill.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - msg
                  - data
                properties:
                  code:
                    type: integer
                    const: 200
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/SavedSkill"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/agent-skills:
    get:
      tags:
        - Agent Skills
      operationId: listAgentSkills
      summary: List or search agent skills
      description: |
        The skill catalog, best first. All filters are optional: `type` keeps one kind of result, `task` keeps skills tagged with that task,
        and `q` ranks by relevance to free text (name, tasks, summary) and leaves out skills that match none of its words.
        Only metadata is returned; download a package with `GET /api/v1/agent-skills/{slug}/download`.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - video
              - image
              - slides
              - web
        - name: task
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Matching skills.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - msg
                  - data
                properties:
                  code:
                    type: integer
                    const: 200
                  msg:
                    type: string
                  data:
                    type: object
                    required:
                      - items
                      - total
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AgentSkill"
                      total:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/agent-skills/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]*$
    get:
      tags:
        - Agent Skills
      operationId: getAgentSkill
      summary: Get one agent skill with install instructions
      description: |
        The skill's metadata plus `install`: the folder name inside the package, the download path, the install prompt to paste into an agent,
        and for each supported agent its personal and project skills folders, how to call the skill, and a shell command that downloads and unzips it
        (it reads your key from `$POPNOW_API_KEY`).
      responses:
        "200":
          description: The skill.
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - msg
                  - data
                properties:
                  code:
                    type: integer
                    const: 200
                  msg:
                    type: string
                  data:
                    $ref: "#/components/schemas/AgentSkillDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/v1/agent-skills/{slug}/download:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]*$
    get:
      tags:
        - Agent Skills
      operationId: downloadAgentSkill
      summary: Download an agent skill package
      description: |
        Redirects (302) to a short-lived signed link for `popnow-<slug>.zip`, which holds one folder, `popnow-<slug>/`, with `SKILL.md` inside.
        Follow the redirect (`curl -fL`) and unzip the archive into your agent's skills folder. The link expires after a few minutes and is never cached.

        Each copy is licensed to your account: it carries `popnow-<slug>/.popnow-license.json` and a `License ID` line in `LICENSE.txt`.

        Skills are free, with a limit on how many **different** skills an account adds (the website, this endpoint and the MCP `use_skill` tool share it).
        Downloading a skill you already added never counts. Accounts that have never bought credits can add 5 new skills in any 24 hours and 20 in total;
        accounts that have bought credits can add 30 new skills in any 24 hours with no total limit. Over the limit the API answers 429 with business code
        `42901` and `data.reason = "skill_quota"`; `data.scope` is `daily` (with `retryAfter` seconds, `resetAt` and a `Retry-After` header) or `lifetime`.
      responses:
        "302":
          description: Redirect to the package.
          headers:
            Location:
              description: Short-lived signed download link.
              schema:
                type: string
                format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many requests in a minute, or the skill limit (business code 42901, data.reason skill_quota) was reached.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: sk-popnow-<48 lowercase hex characters>
      description: "Send `Authorization: Bearer sk-popnow-...`. Create keys in the developer console at https://popnow.ai/api/console and keep them server-side."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable key for one logical task submission; retained for 24 hours per account and bound to both the submitting API key and normalized request fingerprint. A sibling key receives 409 without the original task ID.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequestTags:
      name: X-PopNow-Tags
      in: header
      required: false
      description: "Up to 10 comma-separated tags for this task (letters, digits and `. _ - : /`, at most 40 characters each, stored lower-cased). Tags are shown in the console logs, can be used to filter logs and split usage, and are kept with the task's billing record. They never reach the model and never change the price. Do not put personal data in tags; use `metadata` for values that should be removed together with the prompt."
      schema:
        type: string
        example: checkout,exp:b
    PopNowRetention:
      name: X-PopNow-Retention
      in: header
      required: false
      description: |-
        Retention for this one task, in whole seconds. It applies to both the generated outputs and the stored request text. The effective value is always `min(header, account setting, platform maximum)`: a request can only shorten retention, never extend it.
        `0` is valid and means the outputs are removed as soon as the task reaches a terminal state. Values that cannot be applied never fail the request: a negative number is clamped to `0`, a value above the ceiling is clamped to the ceiling, and a value that is not a decimal integer is ignored so the account setting applies. The effective result is always reported back in `retention` on the task record.
        Accepted by `createTask`. `retry` inherits the source task's effective value and ignores this header, so one task family never ends up with two different expiry times. `quote` does not accept it because it does not create a task.
      schema:
        type: string
        pattern: ^-?[0-9]+$
  headers:
    PopNowTaskId:
      description: The PopNow task (`job_…`) that ran this synchronous text request — the same `taskId` that `GET /api/v1/jobs` and `recordInfo` return, so a call can be matched to its charge. Set as soon as the request is accepted, including on error responses returned after acceptance (the task shows the refund). Absent when the request was rejected before a task was created (for example a validation error), and on a streamed response whose headers were already flushed by a keep-alive before acceptance.
      schema:
        type: string
    PopNowKeepalive:
      description: Present, with the value `1`, only on a non-streaming text response that was still running after about 30 seconds. The `200` status was sent early to keep the connection open, the body starts with whitespace (newlines sent every 15 seconds), and then comes the JSON answer — or, if the request failed after that point, the protocol's own error object with the code and message it would otherwise have had. Absent on responses that finished sooner, which are unchanged.
      schema:
        type: string
        enum:
          - "1"
    RateLimitLimit:
      description: Capacity of the active account-level rate-limit window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Remaining requests in the active window.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid JSON, query, callback URL, model input, or media declaration. Invalid callBackUrl values return code 400 and msg "Invalid callback URL" with request_id. Submitted hosts, IP addresses, and DNS diagnostics are not echoed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing, malformed, expired, revoked, or otherwise invalid API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PaymentRequired:
      description: Insufficient balance (`40201`) or a spend cap was reached (`40202`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Account, model, API-key, IP, or region authorization failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource does not exist or is not visible to this account and API key. These cases are intentionally indistinguishable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Idempotency or media-transfer state conflicts with this request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: Request body exceeds the server's accepted size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Account-level request limit exceeded.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Internal failure. Details are not exposed; report `request_id` to support.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: "HTTP 503 carries one of three business codes. `50301`: no usable deployment or effective customer price exists for the selected model. `503`: a dependency is temporarily unavailable; retry after the `Retry-After` header when it is present. `50302`: a synchronous generation failed upstream and the charge was refunded. Nothing was charged, but send the retry with a **new** `Idempotency-Key`: reusing the original one replays the recorded failure instead of generating again."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OpenAIError:
      description: "Error in the OpenAI `{error:{message,type,param,code}}` shape. The HTTP status is the same one `/api/v1` would return. A content-policy refusal is HTTP 400 with `code: content_rejected`, so it can be told apart from a parameter error (`invalid_request` / `unsupported_parameter`, with `param` set when the error is about one field)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorBody"
    AnthropicError:
      description: Error in the Anthropic `{type:"error",error:{type,message}}` shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnthropicErrorBody"
    GeminiError:
      description: Error in the Google `{error:{code,message,status}}` shape. `status` is the google.rpc code name (for example `INVALID_ARGUMENT`, `UNAUTHENTICATED`, `RESOURCE_EXHAUSTED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GeminiErrorBody"
  schemas:
    FundingGrantItem:
      type: object
      required:
        - id
        - name
        - amountUsd
        - availableUsd
        - heldUsd
        - spentUsd
        - status
        - startsAt
        - modelSlugs
        - customerMemo
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        amountUsd:
          type: string
        availableUsd:
          type: string
        heldUsd:
          type: string
        spentUsd:
          type: string
        status:
          type: string
        startsAt:
          type: string
          format: date-time
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        modelSlugs:
          type: array
          items:
            type: string
          description: Empty means all models.
        customerMemo:
          type: string
        createdAt:
          type: string
          format: date-time
    CreditFacilityItem:
      type: object
      required:
        - enabled
        - limitUsd
        - availableUsd
        - usedUsd
        - heldUsd
        - status
        - version
      properties:
        enabled:
          type: boolean
        limitUsd:
          type: string
          description: Approved ceiling, not wallet funds.
        availableUsd:
          type: string
        usedUsd:
          type: string
          description: Outstanding settled principal.
        heldUsd:
          type: string
          description: Credit reserved for accepted tasks.
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        status:
          type: string
        version:
          type: integer
          format: int64
    FundingOverview:
      type: object
      required:
        - balanceUsd
        - heldUsd
        - prepaidAvailableUsd
        - grantAvailableUsd
        - cashShortfallUsd
        - credit
        - grants
        - grantsHasMore
      properties:
        balanceUsd:
          type: string
          description: Net wallet available balance; may be negative for approved credit consumption or external payment recovery.
        heldUsd:
          type: string
        prepaidAvailableUsd:
          type: string
          description: Unrestricted prepaid or legacy available funds.
        grantAvailableUsd:
          type: string
          description: Active available grants; model applicability is checked at task admission.
        cashShortfallUsd:
          type: string
          description: External payment recovery shortfall that cannot be covered by grants or credit.
        credit:
          $ref: "#/components/schemas/CreditFacilityItem"
        grants:
          type: array
          items:
            $ref: "#/components/schemas/FundingGrantItem"
        grantsHasMore:
          type: boolean
    EnvelopeBase:
      type: object
      required:
        - code
        - msg
        - request_id
      properties:
        code:
          type: integer
        msg:
          type: string
        request_id:
          type: string
          description: Correlation identifier. Include it in support requests.
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            code:
              type: integer
              enum:
                - 400
                - 40003
                - 40004
                - 401
                - 40201
                - 40202
                - 403
                - 40301
                - 40302
                - 40303
                - 40310
                - 404
                - 409
                - 40901
                - 413
                - 429
                - 500
                - 503
                - 50301
                - 50302
              description: "Business code. `40003`: an uploaded file's actual size, media type or signature does not match its upload ticket (file commit). `40004`: the request is valid but no deployment can serve this exact parameter combination; change the named parameter and retry. `503`: a dependency is temporarily unavailable (for example a list or usage query timed out, or inline image storage failed); honour `Retry-After` when present. `50301`: the model has no usable deployment or effective price right now. `50302`: a synchronous generation (streaming) failed upstream and the charge was refunded. Retry with a **new** `Idempotency-Key` — the original key replays the same failure, so a transport-level retry that keeps the key can never succeed. `40301`: this key is not allowed to call this model — check the key's model restrictions in the Console. `40302`: the caller's address is not in this key's IP allow-list. `40303`: the request comes from a region this service is not offered in; the message deliberately does not state how that is determined, and neither does this description. `40310`: the account has not verified its email address yet, so it cannot run models. Open the verification link that was emailed at sign-up, or send a new one from the Console; the key starts working as soon as the address is verified, with no change on your side."
            msg:
              type: string
              description: Human-readable explanation, English unless `Accept-Language` or the account's API error language selects another supported language. Never parse it; branch on `code`.
            data:
              type: object
              description: "Present only when the failure carries a machine-readable reason; otherwise absent. `code`, the HTTP status and `msg` are the same with or without it. `asset_library_locked` (400): the asset library opens after the first top-up. `asset_library_full` (400): the allowance is full. `asset_file_too_large` (400): the file is above the plan's per-file limit. `asset_daily_limit` (429): the daily number of new assets is reached; honour `Retry-After`. `asset_storage_full` (503): storage is full across the platform. `asset_permission_denied` (403): the caller's team role does not allow this change. `asset_workspace_forbidden` (403): this key or workspace cannot reach that library. `adult_content`, `minor_safety` and `image_rejected` (400): the content safety gate declined the prompt or an input image before anything was charged. New values may be added; treat unknown values like an absent reason."
              required:
                - reason
              properties:
                reason:
                  type: string
                  enum:
                    - asset_library_locked
                    - asset_library_full
                    - asset_file_too_large
                    - asset_daily_limit
                    - asset_storage_full
                    - asset_permission_denied
                    - asset_workspace_forbidden
                    - asset_entity_name_taken
                    - unknown_model
                    - unknown_task
                    - insufficient_credits
                    - adult_content
                    - minor_safety
                    - image_rejected
                    - signup_paused
                    - agent_quota
                    - agent_rate
                    - agent_turns
                    - agent_skill_invalid
                    - agent_skill_turns
                    - price_changed
                    - agent_project_budget
                    - web_fetch
                    - team_role_cannot_spend
                    - team_allowance_reached
                    - team_wallet_empty
                    - team_limit_reached
                    - skill_quota
                    - skill_rate_needs_install
                    - handoff_invalid
                    - age_restricted
                    - apple_reauth_required
                    - pending
                    - other_account
                    - revoked
                    - invalid
                    - budget_exceeded
                    - mfa_required
                    - model_unavailable
                    - model_retired
    CreateTaskRequest:
      type: object
      required:
        - model
        - input
      additionalProperties: false
      properties:
        model:
          type: string
          minLength: 1
          description: Model call name, `<publisher>/<model>/<task>` (for example `alibaba/wan-3.0/image-to-video`). The list below is the catalog at generation time; `GET /api/v1/models` is the live source.
          enum:
            - alibaba/happyhorse-1.1/image-to-video
