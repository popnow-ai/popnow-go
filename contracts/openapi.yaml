      summary: Get one recipe or workflow with its current price
      description: |
        `currency` is USD. Optional `estimated_usd` is a decimal string for the current price with saved material; omitted when unavailable. Obtain `quote_id` from POST /run before confirming execution.
        `prompt` is returned only for your own recipes. A recipe you can't reach returns 404.
